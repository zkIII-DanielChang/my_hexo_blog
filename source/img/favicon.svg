<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Heraldic shield</title>
  <defs>
    <path id="shield" d="M32 4 L57 13 C57 33 50 50 32 60 C14 50 7 33 7 13 Z"/>
    <clipPath id="shieldClip"><use href="#shield"/></clipPath>
  </defs>

  <!-- Azur field -->
  <use href="#shield" fill="#1e3a5f"/>

  <!-- Cross potent, or, clipped to the shield so it can never overhang -->
  <g clip-path="url(#shieldClip)" fill="#c9a227">
    <rect x="28" y="16" width="8" height="32" rx="1"/>
    <rect x="16" y="27" width="32" height="8" rx="1"/>
    <rect x="22" y="9"  width="20" height="8" rx="1"/>
    <rect x="22" y="47" width="20" height="8" rx="1"/>
    <rect x="9"  y="23" width="8" height="16" rx="1"/>
    <rect x="47" y="23" width="8" height="16" rx="1"/>
  </g>

  <!-- Gold tressure -->
  <use href="#shield" fill="none" stroke="#c9a227" stroke-width="3" stroke-linejoin="round"/>
</svg>
